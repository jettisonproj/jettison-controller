apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: jettisonproj
  name: operate-workflow-role
rules:
  - apiGroups:
      - argoproj.io
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
    resources:
      - workflows
