apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: jettisonproj
  name: deploy-step-executor
rules:
  # k8s standard APIs
  - apiGroups:
      - ""
    resources:
      - services
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "gateway.networking.k8s.io"
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
  # Argo resources
  - apiGroups:
      - argoproj.io
    resources:
      - analysistemplates
      - rollouts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
